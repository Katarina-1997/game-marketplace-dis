name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build all services
        run: ./gradlew build -x test

      - name: Run unit tests
        run: ./gradlew :catalog-service:test :inventory-service:test :order-service:test :payment-service:test :store-composite-service:test

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build catalog-service Docker image
        run: docker build -f catalog-service/Dockerfile -t catalog-service .

      - name: Build inventory-service Docker image
        run: docker build -f inventory-service/Dockerfile -t inventory-service .

      - name: Build order-service Docker image
        run: docker build -f order-service/Dockerfile -t order-service .

      - name: Build payment-service Docker image
        run: docker build -f payment-service/Dockerfile -t payment-service .

      - name: Build store-composite-service Docker image
        run: docker build -f store-composite-service/Dockerfile -t store-composite-service .