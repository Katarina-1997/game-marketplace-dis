server.port=8080

spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=catalog-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://catalog-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/games/**

spring.cloud.gateway.server.webmvc.routes[1].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://inventory-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.server.webmvc.routes[4].id=store-composite-service
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://store-composite-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/store/**
