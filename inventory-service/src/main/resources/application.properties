spring.config.import=optional:configserver:http://localhost:8888

server.port=8082

spring.application.name=inventory-service

spring.mongodb.host=localhost
spring.mongodb.port=27017
spring.mongodb.database=inventory-db

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.function.definition=paymentProcessedConsumer

spring.cloud.stream.bindings.paymentProcessedConsumer-in-0.destination=payment-processed
spring.cloud.stream.bindings.paymentProcessedConsumer-in-0.group=inventory-service-group

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest